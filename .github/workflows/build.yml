# Build the app

name: Build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build hex.sln -c Release

      - name: Publish
        run: dotnet publish hex.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: hex-win-x64
          path: publish/hex.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/hex.exe --title "${{ github.ref_name }}" --generate-notes
